# Toolforge jobs: `toolforge jobs load jobs.yaml`. Each runs `job <command>`
# (see the Procfile) in the image that ./build.sh makes.
- name: buggregator-update
  command: job buggregator-update
  image: tool-magnustools/tool-magnustools:latest
  schedule: "37 3 * * *"
  mount: all
  emails: onfailure
- name: webstatus
  command: job webstatus
  image: tool-magnustools/tool-magnustools:latest
  schedule: "5,35 * * * *"
  mount: all
  emails: onfailure
- name: dashboard-maintenance
  command: job dashboard-maintenance
  image: tool-magnustools/tool-magnustools:latest
  schedule: "27 * * * *"
  mount: all
  emails: onfailure
- name: dashboard-alerts
  command: job dashboard-alerts
  image: tool-magnustools/tool-magnustools:latest
  schedule: "*/5 * * * *"
  mount: all
  emails: onfailure
- name: tool-monitor
  command: job monitor
  image: tool-magnustools/tool-magnustools:latest
  schedule: "15,45 * * * *"
  mount: all
  emails: onfailure
# Still PHP: clears the PHP tools' temporary files.
- name: cleanup-tmp
  command: find /data/project/magnustools/tmp/ -mtime +1 -exec rm -rf {} \;
  image: php8.4
  schedule: "9 9 * * *"
  mount: all
  mem: 100Mi
