[package]
name = "magnustools_rs"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Web service and background jobs of the magnustools Toolforge tool"
repository = "https://github.com/magnusmanske/magnustools_rs"
authors = ["Magnus Manske <magnusmanske@googlemail.com>"]

[dependencies]
anyhow = "1"
askama = "0.16"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie-private"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
percent-encoding = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.13", features = ["json", "form", "query", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["fs", "trace", "timeout", "compression-gzip", "compression-br", "catch-panic", "set-header"] }
tracing = "0.1"
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", features = ["database", "http", "logging", "server", "telemetry", "telemetry-wire", "toolforge"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "symbols"
