<template id='issue-list-template'>
<div class='container-fluid dash'>
	<tool-navbar>
		<div slot='right'>
			<widar></widar>
		</div>
	</tool-navbar>

	<div class='dash-filters'>
		<h2 class='h4 mb-0 mr-3' tt='issues'></h2>
		<span class='filter-label'>Status</span>
		<div class='btn-group btn-group-sm' role='group' aria-label='Status'>
			<button v-for='value in config.status' type='button'
				:class='"btn btn-outline-secondary"+(filters.status[value]?" active":"")'
				:aria-pressed='filters.status[value]?true:false'
				@click='toggle("status",value)'>{{capitalize(value)}}</button>
		</div>
		<span class='filter-label ml-2'>Priority</span>
		<div class='btn-group btn-group-sm' role='group' aria-label='Priority'>
			<button v-for='value in config.priority' type='button'
				:class='"btn btn-outline-secondary"+(filters.priority[value]?" active":"")'
				:aria-pressed='filters.priority[value]?true:false'
				@click='toggle("priority",value)'>{{capitalize(value)}}</button>
		</div>
		<select v-model='filters.tool' class='custom-select custom-select-sm issue-select' @change='load_results' aria-label='Tool'>
			<option value='' tt='any_tool'></option>
			<option value='0' tt='tool_not_assigned'></option>
			<option v-for='tool,tool_id in config.tools' :value='tool_id'>{{tool.nice_name}}</option>
		</select>
		<router-link to='/dashboard' class='ml-auto'>Service dashboard</router-link>
		<router-link to='/usage'>Usage</router-link>
	</div>

	<div class='dash-filters'>
		<span class='filter-label'>Site</span>
		<div class='btn-group btn-group-sm flex-wrap' role='group' aria-label='Site'>
			<button v-for='value in config.site' type='button'
				:class='"btn btn-outline-secondary"+(filters.site[value]?" active":"")'
				:aria-pressed='filters.site[value]?true:false'
				:title='siteLabel(value)'
				@click='toggle("site",value)'>
				<img v-if='siteIcon(value)' :src='siteIcon(value)' class='site-icon' alt='' />{{siteLabel(value)}}
			</button>
		</div>
		<span class='filter-label ml-2' tt='sort_by'></span>
		<select v-model='filters.sort_by' class='custom-select custom-select-sm issue-select' @change='load_results' aria-label='Sort by'>
			<option v-for='o in sort_by_options' :tt='o' :value='o'></option>
		</select>
		<div class='btn-group btn-group-sm' role='group' aria-label='Sort order'>
			<button v-for='order in sort_orders' type='button'
				:class='"btn btn-outline-secondary"+(filters.sort_order==order?" active":"")'
				:aria-pressed='filters.sort_order==order?true:false'
				@click='setSortOrder(order)'><span :tt='order'></span></button>
		</div>
	</div>

	<div class='issue-stats'>
		<span class='dash-muted'><span tt='this_query'></span> {{stats.this_query}}</span>
		<span class='dash-muted'><span tt='total_open'></span> {{stats.total_open}}</span>
		<span class='ml-auto d-inline-flex align-items-center'>
			<a v-if='filters.offset>0' href='#' class='mr-2' @click.prevent='go_to_offset(filters.offset-filters.limit)' tt='prev'></a>
			<input class='form-control form-control-sm offset-input' type='number' v-model.number='filters.offset' @keyup.enter='go_to_offset(filters.offset)' aria-label='Offset' />
			<a v-if='filters.offset+filters.limit<stats.this_query' href='#' class='ml-2' @click.prevent='go_to_offset(filters.offset+filters.limit)' tt='next'></a>
		</span>
	</div>

	<div class='dash-muted' v-if='loading'><i tt='loading'></i></div>
	<div class='dash-muted' v-else-if='results.length==0'><i tt='no_results'></i></div>
	<div class='table-responsive' v-else>
		<table class='table table-sm issues'>
			<thead>
				<tr>
					<th class='col-site'><span class='sr-only'>Site</span></th>
					<th>Issue</th>
					<th class='col-tool'>Tool</th>
					<th class='col-status'>Status</th>
					<th class='col-priority'>Priority</th>
					<th class='col-updated'>Updated</th>
				</tr>
			</thead>
			<tbody>
				<tr v-for='r in results' :class='{"closed":r.status=="CLOSED"}'>
					<td class='col-site'>
						<a v-if='r.url' :href='r.url' target='_blank' rel='noopener noreferrer' :title='siteLabel(r.site)'>
							<img v-if='siteIcon(r.site)' :src='siteIcon(r.site)' class='site-icon' :alt='siteLabel(r.site)' />
							<span v-else class='dash-muted'>{{r.site}}</span>
						</a>
						<span v-else class='dash-muted'>{{r.site}}</span>
					</td>
					<td>
						<div class='issue-title'><router-link :to='issueLink(r)'>{{r.label || ("#"+r.id)}}</router-link></div>
						<div class='issue-id' v-if='r.label'>#{{r.id}}</div>
						<div class='issue-snippet' v-if='r.description' :title='r.description'>{{r.description}}</div>
					</td>
					<td class='col-tool'>
						<tool-picker :can_edit='can_edit()' :toolid='r.tool' @tool-id-changed='changeToolId(r.id,$event)'></tool-picker>
					</td>
					<td class='col-status'>
						<span :class='"status-icon status-"+statusInfo(r.status).severity' aria-hidden='true'>{{statusInfo(r.status).icon}}</span>
						<span class='status-text'>{{statusInfo(r.status).label}}</span>
						<button v-if='can_edit() && r.status=="OPEN"' type='button' class='close-issue' title='Close issue' @click='changeIssueStatus(r.id,"CLOSED")'>
							<span tt='close_issue'>close</span>
						</button>
					</td>
					<td class='col-priority'>
						<span :class='"priority-icon status-"+priorityInfo(r.priority).severity' :title='"Priority: "+priorityInfo(r.priority).label' aria-hidden='true'>{{priorityInfo(r.priority).icon}}</span>
						<span class='sr-only'>{{priorityInfo(r.priority).label}} priority</span>
					</td>
					<td class='col-updated' :title='r.date_last'>
						<div>{{ago(r.date_last)}}</div>
						<div class='issue-created' v-if='r.date_created && r.date_created!=r.date_last'>created {{ago(r.date_created)}}</div>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
</template>

<script>
'use strict';

let IssueList = Vue.extend ( {
	props : [] ,
	data : function () { return { filters : { search:'' , status:{} , sort_by:'date_last' , sort_order:'descending' , site:{} , tool:'' , priority:{} , limit:25 , offset:0 } ,
		results:[] , loading:false , stats:{} ,
		sort_by_options:['label','status','date_created','date_last','site','tool','priority'] ,
		button_groups:['site','status','priority'] ,
		sort_orders:['ascending','descending'] ,
	} } ,
	created : function () {
		let me = this ;
		$.each ( me.button_groups , function ( dummy0 , key ) {
			$.each ( config[key] , function(dummy,value){Vue.set(me.filters[key],value,false)})
		} ) ;
		me.filters.status.OPEN = true ;
		me.readUrl() ;
		me.load_results();
		tt.updateInterface(this.$el) ;
	} ,
	mounted : function () {
		tt.updateInterface(this.$el) ;
	} ,
    updated : function () { tt.updateInterface(this.$el) ; } ,
	methods : {
		// Restore the filters from the URL; anything unknown keeps its default.
		readUrl : function () {
			let me = this , q = me.$route.query ;
			if ( typeof q.search == 'string' ) me.filters.search = q.search ;
			if ( me.sort_by_options.indexOf ( q.sort_by ) != -1 ) me.filters.sort_by = q.sort_by ;
			if ( me.sort_orders.indexOf ( q.sort_order ) != -1 ) me.filters.sort_order = q.sort_order ;
			if ( typeof q.tool == 'string' && ( q.tool == '0' || /^\d+$/.test(q.tool) ) ) me.filters.tool = q.tool ;
			$.each ( me.button_groups , function ( dummy , group ) {
				if ( typeof q[group] != 'string' ) return ;
				let wanted = q[group].split ( ',' ) ;
				$.each ( me.filters[group] , function ( key ) {
					me.filters[group][key] = wanted.indexOf ( key ) != -1 ;
				} ) ;
			} ) ;
			if ( typeof q.limit == 'string' && /^\d+$/.test(q.limit) ) me.filters.limit = Math.max ( 1 , parseInt ( q.limit , 10 ) ) ;
			if ( typeof q.offset == 'string' && /^\d+$/.test(q.offset) ) me.filters.offset = parseInt ( q.offset , 10 ) ;
		} ,
		// Only what differs from the defaults, so the URL stays short.
		updateUrl : function () {
			let me = this , query = {} ;
			if ( me.filters.search ) query.search = me.filters.search ;
			if ( me.filters.sort_by != 'date_last' ) query.sort_by = me.filters.sort_by ;
			if ( me.filters.sort_order != 'descending' ) query.sort_order = me.filters.sort_order ;
			if ( me.filters.tool !== '' ) query.tool = me.filters.tool ;
			if ( me.filters.limit != 25 ) query.limit = me.filters.limit.toString() ;
			if ( me.filters.offset > 0 ) query.offset = me.filters.offset.toString() ;
			let selected = function ( group ) {
				return Object.keys ( me.filters[group] ).filter ( function ( key ) { return me.filters[group][key] } ) ;
			} ;
			$.each ( [ 'site' , 'priority' ] , function ( dummy , group ) {
				let values = selected ( group ) ;
				if ( values.length ) query[group] = values.join ( ',' ) ;
			} ) ;
			// The default is OPEN only; an empty selection has to stay expressible.
			let statuses = selected ( 'status' ) ;
			if ( statuses.length != 1 || statuses[0] != 'OPEN' ) query.status = statuses.join ( ',' ) ;
			me.$router.replace ( { path:'/' , query:query } ).catch ( function(){} ) ;
		} ,
		load_results : function () {
			let me = this ;
			me.updateUrl() ;
			me.loading = true ;
			me.results = [] ;
			let params = JSON.parse ( JSON.stringify(me.filters) ) ;
			$.each ( me.button_groups , function ( dummy , group ) {
				params[group] = me.collapse_options(params[group]);
			} ) ;
			params.action = 'get_issues' ;
			//console.log(params);
			$.get('./api.php',params,function(d){
				//console.log(d) ;
				if ( d.status == 'OK' ) {
					me.results = d.data.results ;
					me.stats = d.data.stats ;
				} else {
					alert ( d.status ) ;
				}
				me.loading = false ;
			} ) ;
		} ,
		collapse_options : function ( o ) {
			let ret = [] ;
			$.each ( o , function ( k , v ) {
				if ( v ) ret.push(k);
			} ) ;
			return ret.join(',');
		} ,
		toggle : function ( group , value ) {
			this.filters[group][value] = !this.filters[group][value] ;
			this.load_results() ;
		} ,
		setSortOrder : function ( order ) {
			this.filters.sort_order = order ;
			this.load_results() ;
		} ,
		go_to_offset : function ( new_offset ) {
			this.filters.offset = Math.max ( 0 , Math.floor ( new_offset * 1 ) || 0 ) ;
			this.load_results();
		} ,
		// The list keeps its filters in the URL, so the detail page can link back to them.
		issueLink : function ( r ) {
			return { path:'/issue/'+r.id , query:{ from:this.$route.fullPath } } ;
		} ,
		can_edit : function () { return issue_ui.can_edit() } ,
		siteIcon : function ( site ) { return issue_ui.siteIcon(site) } ,
		siteLabel : function ( site ) { return issue_ui.siteLabel(site) } ,
		statusInfo : function ( status ) { return issue_ui.status(status) } ,
		priorityInfo : function ( priority ) { return issue_ui.priority(priority) } ,
		ago : function ( timestamp ) { return issue_ui.ago(timestamp) } ,
		capitalize : function (s) { return issue_ui.capitalize(s) } ,
		changeIssueStatus : function ( issue_id , new_status ) {
			let me = this ;
			$.post ( './api.php' , {
				action : 'set_issue_status' ,
				issue_id : issue_id ,
				new_status : new_status
			} , function ( d ) {
				if ( d.status == 'OK' ) {
					$.each ( me.results , function ( num , r ) {
						if ( r.id == issue_id ) me.results[num].status = new_status ;
					} ) ;
				} else {
					alert ( d.status ) ;
				}
			} , 'json' ) ;
		} ,
		changeToolId : function ( issue_id , new_tool_id ) {
			let me = this ;
			$.post ( './api.php' , {
				action : 'set_issue_tool' ,
				issue_id : issue_id ,
				new_tool_id : new_tool_id
			} , function ( d ) {
				if ( d.status == 'OK' ) {
					$.each ( me.results , function ( num , r ) {
						if ( r.id == issue_id ) me.results[num].tool = new_tool_id ;
					} ) ;
				} else {
					alert ( d.status ) ;
				}
			} , 'json' ) ;
		}
	} ,
	template : '#issue-list-template'
} ) ;

</script>
