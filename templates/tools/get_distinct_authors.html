{% extends "base.html" %}
{% block content %}
<p class="lead">The registered users who edited a set of articles, with their numbers of edits, as plain text.</p>
<form method="get" action="get_distinct_authors.php">
  <label>Language <input type="text" name="language" value="{{ request.language }}" required></label>
  <label>Project <input type="text" name="project" value="{{ request.project }}" required></label>
  <label>Articles <span class="hint">one per line</span>
    <textarea name="pages" rows="8" required></textarea>
  </label>
  <button>List authors</button>
</form>
{% endblock %}
